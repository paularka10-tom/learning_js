<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>CHAI AUR CODE</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const okArka = function(){
        console.log("Arka");
    }
    setTimeout(okArka,3000) //just providin reference, not executing with ()
    const changesText = function(){
        document.querySelector('h1').innerHTML = "Worst JS series ever"
    }
    const refo = setTimeout(changesText, 2500)

    document.querySelector('#stop').addEventListener('click',function(){clearTimeout(refo)
        console.log("STOPPED")
    })
</script>
</html>
